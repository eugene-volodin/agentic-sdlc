[project]
name = "bookkit"
version = "0.1.0"
description = "Builds an illustrated A4 PDF book from Markdown chapters"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0",
    "pygments>=2.17",
    "pyyaml>=6.0",
    "playwright>=1.45",
    "segno>=1.6.6",
    "fonttools>=4.50",
    "pyphen>=0.17",
]

[project.scripts]
book = "bookkit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.17.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookkit"]
