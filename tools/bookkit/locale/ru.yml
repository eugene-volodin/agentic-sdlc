# Russian text used by the layout engine. Override any key under `strings:` in the book's book.yml.
language: ru

characters:
  professor:
    name: Профессор Фортран
    role: Самый известный профессор в Компьютерном Городе Симплексе.
    aliases: [профессор, фортран, prof, fortran]
  cat:
    name: Кот Икс
    role: Лучший ученик профессора Фортрана.
    aliases: [кот, икс, x]
  caterpillar:
    name: Гусеница
    role: Самая прилежная ученица профессора Фортрана.
    aliases: [гусеница]
  sparrow:
    name: Воробей
    role: Очень способный ученик — всё схватывает на лету.
    aliases: [воробей]
  agent:
    name: Агент
    role: Новый ученик-робот — быстро печатает и пока не знает ваших порядков.
    aliases: [агент, робот, ai, robot]

labels:
  chapter: Глава
  intro: Вступление
  contents: Что внутри
  prompt: ПРОМПТ
  prompt_hint: Скопируй этот промпт и вставь агенту как есть.
  terminal: терминал
  computer_brand: ФОРТРАН-86
  do: Так хорошо
  dont: Так не надо
  recap: Главное
  file: файл
  continued: продолжение →   # under the first part of a block split between pages
  continuation: продолжение   # in the title of a prompt's second monitor
  version: Ты читаешь версию
  download: Скачать свежую версию
  version_short: версия
  soon: скоро
  minutes: мин

callouts:
  tip: Совет
  warn: Осторожно!
  idea: Идея
  try: Попробуй сам

typography:
  quotes: "«»„“"
  # Short words that must not be left hanging at the end of a line.
  short_words: [в, во, и, к, ко, с, со, у, о, об, а, я, на, не, ни, по, за, из, от, до, но, же, ли, бы, для, что, как, это, при, над, под, без]

# Lettering inside the pictures of the chapter openers (art/stories.py and the worlds' openers), opener by opener.
openers:
  city_road:                     # the conclusion's opener: the signpost by the professor's gate
    city: В город
    home: Домой
  station: {station: Станция, logs: Логи, tickets: Тикеты, base: База, metrics: Метрики}
  kitchen: {prompts: промпты, skills: скиллы, hooks: хуки, mcp: MCP, subagents: субагенты, checks: проверки,
            copypaste: копипаста, legacy: легаси, crutches: костыли}

# Easter eggs (art/world_kit.py): the letters on the golden floppies hidden in the chapter worlds, in chapter order.
easter:
  floppies: [A, G, E, N, T, S, ".", m, d]

# Lettering of the chapter worlds (art/worlds.py): the labels of the machine's stations and the signs in them.
