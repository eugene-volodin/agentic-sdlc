name: Outdated fact
description: A tool, model, command or price has changed since the book was written
labels: [documentation]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Chapter, section and page
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How it is now
      description: Link the official documentation or changelog that shows the change
    validations:
      required: true
