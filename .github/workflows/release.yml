# Releases the book on every push to main: builds agentic-sdlc.pdf and publishes it as a GitHub release tagged with
# the version from book/book.yml. The link https://github.com/<owner>/agentic-sdlc/releases/latest/download/agentic-sdlc.pdf
# (the QR code and the button on the book's «Свежая версия» page) always leads to the newest one. A version that already has
# a release is not released again: every change of the book raises the version (check.yml fails without it).
name: release

on:
  push:
    branches: [main]
    paths: ["book/**", "tools/**"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - name: Google Chrome
        run: google-chrome --version || uv run --frozen playwright install --with-deps chrome
      - name: Dependencies
        run: uv sync --frozen
      - name: Version
        id: version
        run: echo "tag=v$(uv run --frozen python -c 'import yaml; print(yaml.safe_load(open("../book/book.yml"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Already released?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then echo "yes=1" >> "$GITHUB_OUTPUT"; fi
      - name: Build
        if: steps.exists.outputs.yes != '1'
        run: uv run book build --strict
      - name: Release
        if: steps.exists.outputs.yes != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.version.outputs.tag }}" ../dist/agentic-sdlc.pdf --target "${{ github.sha }}"
          --title "${{ steps.version.outputs.tag }}" --notes "How to build an Agentic SDLC in your repository (in Russian), version ${{ steps.version.outputs.tag }}."
