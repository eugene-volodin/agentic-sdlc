# Releases the book on every push to main: runs tools/ci.sh inside the image of tools/Dockerfile (tools/container.sh,
# exactly as check.yml) and publishes the PDF it built as a GitHub release tagged with the version from book/book.yml.
# The link https://github.com/<owner>/agentic-sdlc/releases/latest/download/agentic-sdlc.pdf (the QR code and the
# button on the book's «Свежая версия» page) always leads to the newest one. A version that already has a release is
# not released again: every change of the book raises the version (check.yml fails without it).
name: release

on:
  push:
    branches: [main]
    paths: ["book/**", "tools/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Version
        id: version
        run: |
          version="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' book/book.yml)"
          if [ -z "$version" ]; then echo "book/book.yml has no version: line" >&2; exit 1; fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Already released?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then echo "yes=1" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.yes != '1'
      - name: Build image
        if: steps.exists.outputs.yes != '1'
        uses: docker/build-push-action@v6
        with:
          context: tools
          tags: bookkit-build
          load: true
          cache-from: type=gha,scope=bookkit-build
          cache-to: type=gha,mode=max,scope=bookkit-build
      - name: Build and check
        if: steps.exists.outputs.yes != '1'
        env:
          BOOKKIT_IMAGE: bookkit-build
        run: tools/container.sh
      - name: Release
        if: steps.exists.outputs.yes != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.version.outputs.tag }}" dist/ci/agentic-sdlc.pdf --target "${{ github.sha }}"
          --title "${{ steps.version.outputs.tag }}" --notes "How to build an Agentic SDLC in your repository (in Russian), version ${{ steps.version.outputs.tag }}."
